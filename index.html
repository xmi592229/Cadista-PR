<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffeb3b"><link rel="manifest" href="manifest.webmanifest"><title>Match Analyzer</title><style>
:root{--yellow:#ffeb3b;--black:#111;--bg:#f4f5f7;--card:#fff;--border:#ddd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#151515;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:12px 12px 32px}main{max-width:900px;margin:auto}h1{font-size:1.5rem;margin:4px 0 12px}h2{font-size:1.1rem;margin:0 0 12px}h3{font-size:1rem;margin:12px 0 8px}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #00000008}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:10px}label{display:block;font-size:.8rem;color:#555;margin-bottom:4px}input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid #ccc;border-radius:9px;background:#fff;color:#111}button{font:inherit;cursor:pointer;border:0;border-radius:9px;padding:10px 12px;background:var(--yellow);font-weight:700;color:#111}button.dark{background:#111;color:#fff}button.subtle{background:#eee;color:#111}.team{padding:10px;border:2px solid var(--accent);border-radius:11px;margin:8px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.stats input{padding:8px}.pitch{position:relative;display:grid;grid-template-columns:repeat(3,1fr);height:200px;background:#238149;border:3px solid white;outline:1px solid #14542e;border-radius:10px;overflow:hidden}.pitch:before{content:"";position:absolute;top:0;bottom:0;left:50%;border-left:2px solid #ffffff9a}.pitch:after{content:"";position:absolute;width:45px;height:45px;border:2px solid #ffffff9a;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}.zone{z-index:1;color:white;background:#00000012;border:1px solid #ffffff66;border-radius:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}.zone b{font-size:1.35rem}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.event{padding:8px;border-left:5px solid var(--accent);background:#f4f4f4;border-radius:6px;margin:6px 0}.statrow{display:grid;grid-template-columns:75px 1fr 1fr;gap:7px;align-items:center;margin:9px 0;font-size:.85rem}.bar{height:12px;background:#eee;border-radius:10px;overflow:hidden}.fill{height:100%}.muted{color:#666;font-size:.8rem}.report{padding:12px;background:white;border-radius:10px}.install{display:none}.danger{background:#fee;color:#900}.teamtitle{font-weight:800;color:var(--accent);margin-bottom:6px}@media(max-width:420px){body{padding:8px}.card{padding:11px}.grid{gap:7px}.pitch{height:175px}.stats{gap:4px}.stats input{padding:6px}}@media print{body{background:white;padding:0}.noprint{display:none!important}.card{box-shadow:none;border:0;padding:0}.report{padding:0}}
</style></head><body><main id="app"><h1>⚽ Match Analyzer</h1><div class="card"><div class="grid"><div class="field"><label>Equipo local</label><input id="home" value="Local"></div><div class="field"><label>Equipo visitante</label><input id="away" value="Visitante"></div><div class="field"><label>Color local</label><select id="homeColor"><option value="#ffeb3b">🟡 Amarillo</option><option value="#111111">⚫ Negro</option></select></div><div class="field"><label>Color visitante</label><select id="awayColor"><option value="#ffeb3b">🟡 Amarillo</option><option value="#111111">⚫ Negro</option></select></div></div><div class="grid"><div class="field"><label>Goles local</label><input type="number" id="hg" min="0" value="0"></div><div class="field"><label>Goles visitante</label><input type="number" id="ag" min="0" value="0"></div></div></div>
<div class="card"><h2>📊 Estadísticas</h2><div id="stats"></div></div>
<div class="card"><h2>🗺️ Registro de ataque</h2><div class="field"><label>Equipo que ataca</label><select id="zoneTeam"></select></div><p class="muted">Toca una zona para sumar una acción de ataque al equipo seleccionado.</p><div class="pitch"><button class="zone" data-zone="left">IZQUIERDA<b id="leftCount">0</b></button><button class="zone" data-zone="center">CENTRO<b id="centerCount">0</b></button><button class="zone" data-zone="right">DERECHA<b id="rightCount">0</b></button></div><div class="actions"><button class="subtle" id="undo">↩ Deshacer</button><button class="subtle" id="resetZones">⟲ Reiniciar zonas</button></div><p class="muted" id="zoneSummary"></p></div>
<div class="card"><h2>⚽ Registro de goles</h2><div class="grid"><div class="field"><label>Minuto</label><input id="minute" type="number" min="0" placeholder="Ej. 34"></div><div class="field"><label>Equipo</label><select id="goalTeam"></select></div></div><div class="field"><label>Goleador</label><input id="scorer" placeholder="Nombre del jugador"></div><div class="field"><label>Tipo de gol</label><select id="goalType"><option>Jugada colectiva</option><option>Contraataque</option><option>Acción individual</option><option>Centro / remate</option><option>Balón parado</option><option>Penalti</option><option>Gol en propia puerta</option></select></div><button id="addGoal">＋ Añadir gol</button><div id="goalList"></div></div>
<div class="card"><h2>📝 Notas del analista</h2><textarea id="notes" rows="4" placeholder="Observaciones tácticas, puntos fuertes, aspectos a mejorar..."></textarea></div><div class="card noprint"><div class="actions"><button id="print">📄 Imprimir / Guardar PDF</button><button class="subtle" id="refresh">Actualizar informe</button><button class="subtle install" id="installBtn">Instalar app</button></div></div><div class="card report" id="report"></div><div class="card noprint"><button class="danger" id="clearAll">Borrar datos del partido</button><p class="muted">Los datos se guardan en este dispositivo/navegador. Puedes usar Match Analyzer sin conexión después de instalarla.</p></div></main>
<script>(()=>{const $=id=>document.getElementById(id);const stats=[{id:'shots',label:'Remates'},{id:'corners',label:'Córners'},{id:'outside',label:'Remates fuera'}];let goals=[],zones={h:{left:0,center:0,right:0},a:{left:0,center:0,right:0}},history=[];const team=t=>($(t==='h'?'home':'away').value.trim()||(t==='h'?'Local':'Visitante'));const color=t=>$((t==='h'?'homeColor':'awayColor')).value;function save(){try{localStorage.setItem('matchAnalyzerState',JSON.stringify({names:{h:$('home').value,a:$('away').value},colors:{h:$('homeColor').value,a:$('awayColor').value},score:[$('hg').value,$('ag').value],stats:{h:stats.map(s=>$('h'+s.id)?.value||0),a:stats.map(s=>$('a'+s.id)?.value||0)},zones,goals,notes:$('notes').value}))}catch(e){}}function load(){try{let d=JSON.parse(localStorage.getItem('matchAnalyzerState')||'null');if(!d)return;if(d.names){$('home').value=d.names.h||'Local';$('away').value=d.names.a||'Visitante'}if(d.colors){$('homeColor').value=d.colors.h||'#ffeb3b';$('awayColor').value=d.colors.a||'#ffeb3b'}if(d.score){$('hg').value=d.score[0]||0;$('ag').value=d.score[1]||0}zones=d.zones||zones;goals=d.goals||[];$('notes').value=d.notes||'';window._savedStats=d.stats||null}catch(e){}}function teamOptions(){let val=$('zoneTeam').value||'h',gval=$('goalTeam').value||'h';$('zoneTeam').innerHTML=`<option value="h">${esc(team('h'))}</option><option value="a">${esc(team('a'))}</option>`;$('goalTeam').innerHTML=$('zoneTeam').innerHTML;$('zoneTeam').value=val;$('goalTeam').value=gval}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function renderStats(){let old={};stats.forEach(s=>['h','a'].forEach(t=>old[t+s.id]=$('stats').querySelector('#'+t+s.id)?.value??window._savedStats?.[t]?.[stats.indexOf(s)]??0));$('stats').innerHTML=['h','a'].map(t=>`<div class="team" style="--accent:${color(t)}"><div class="teamtitle">${esc(team(t))}</div><div class="stats">${stats.map(s=>`<div><label>${s.label}</label><input type="number" min="0" id="${t+s.id}" value="${old[t+s.id]||0}"></div>`).join('')}</div></div>`).join('');$('stats').querySelectorAll('input').forEach(el=>el.addEventListener('input',()=>{report();save()}))}function statVal(t,id){return Math.max(0,Number($('stats').querySelector('#'+t+id)?.value)||0)}function renderZones(){['left','center','right'].forEach(z=>$(`${z}Count`).textContent=zones[$('zoneTeam').value][z]);$('zoneSummary').textContent=`${team('h')}: ${Object.values(zones.h).reduce((x,y)=>x+y,0)} ataques · ${team('a')}: ${Object.values(zones.a).reduce((x,y)=>x+y,0)} ataques`}function renderGoals(){$('goalList').innerHTML=goals.map((g,i)=>`<div class="event" style="--accent:${color(g.team)}"><b>${g.minute}' · ${esc(team(g.team))}</b><br>${esc(g.scorer||'Sin goleador')} <span class="muted">(${esc(g.type)})</span> <button class="subtle" data-del="${i}">Eliminar</button></div>`).join('')||'<p class="muted">Todavía no hay goles registrados.</p>';$('goalList').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{goals.splice(+b.dataset.del,1);render();report();save()})}function report(){let h=team('h'),a=team('a'),hc=color('h'),ac=color('a'),totH=Object.values(zones.h).reduce((x,y)=>x+y,0),totA=Object.values(zones.a).reduce((x,y)=>x+y,0);let rows=stats.map(s=>{let hv=statVal('h',s.id),av=statVal('a',s.id),m=Math.max(hv,av,1);return `<div class="statrow"><b>${s.label}</b><div class="bar"><div class="fill" style="width:${hv/m*100}%;background:${hc}"></div></div></div><div style="text-align:right">${hv} — ${av}</div><div class="bar" style="grid-column:2/4"><div class="fill" style="width:${av/m*100}%;background:${ac}"></div></div></div>`}).join('');let gt=goals.map(g=>`<div class="event" style="--accent:${color(g.team)}"><b>${g.minute}' · ${esc(team(g.team))}</b> — ${esc(g.scorer||'Sin goleador')}<br><span class="muted">${esc(g.type)}</span></div>`).join('')||'<p>No se registraron goles.</p>';let dom=t=>{let z=zones[t],max=Math.max(...Object.values(z));return max===0?'Sin ataques':z.left===max?'Izquierda':z.center===max?'Centro':'Derecha'};let conclusion=`${h}: ${statVal('h','shots')} remates, ${statVal('h','corners')} córners y ${statVal('h','outside')} remates fuera. ${a}: ${statVal('a','shots')} remates, ${statVal('a','corners')} córners y ${statVal('a','outside')} remates fuera. Ataques predominantes: ${h} por ${dom('h').toLowerCase()}, ${a} por ${dom('a').toLowerCase()}.`;$('report').innerHTML=`<h2 style="text-align:center">INFORME DEL PARTIDO</h2><h2 style="text-align:center">${esc(h)} <span style="color:${hc}">${$('hg').value}</span> – <span style="color:${ac}">${$('ag').value}</span> ${esc(a)}</h2><h3>Comparativa estadística</h3>${rows}<h3>Mapa de ataque</h3><div class="grid"><div class="team" style="--accent:${hc}"><b>${esc(h)}</b><p>Izquierda: ${zones.h.left}</p><p>Centro: ${zones.h.center}</p><p>Derecha: ${zones.h.right}</p><b>Total: ${totH}</b></div><div class="team" style="--accent:${ac}"><b>${esc(a)}</b><p>Izquierda: ${zones.a.left}</p><p>Centro: ${zones.a.center}</p><p>Derecha: ${zones.a.right}</p><b>Total: ${totA}</b></div></div><h3>Goles y cronología</h3>${gt}<h3>Conclusiones</h3><p>${esc(conclusion)}</p><h3>Notas</h3><p style="white-space:pre-wrap">${esc($('notes').value||'Sin notas.')}</p><p class="muted">Match Analyzer · Informe generado desde los datos introducidos</p>`;save()}function render(){teamOptions();renderStats();renderZones();renderGoals();report()}$('pitch')?.querySelectorAll('[data-zone]').forEach(btn=>btn.addEventListener('click',()=>{let t=$('zoneTeam').value,z=btn.dataset.zone;zones[t][z]++;history.push({t,z});renderZones();report()}));document.querySelectorAll('.zone').forEach(btn=>btn.addEventListener('click',()=>{let t=$('zoneTeam').value,z=btn.dataset.zone;zones[t][z]++;history.push({t,z});renderZones();report()}));$('undo').onclick=()=>{let x=history.pop();if(x&&zones[x.t][x.z]>0)zones[x.t][x.z]--;renderZones();report()};$('resetZones').onclick=()=>{zones={h:{left:0,center:0,right:0},a:{left:0,center:0,right:0}};history=[];renderZones();report()};$('addGoal').onclick=()=>{let m=$('minute').value;if(m===''){alert('Introduce el minuto del gol.');return}let t=$('goalTeam').value;goals.push({team:t,minute:m,scorer:$('scorer').value.trim(),type:$('goalType').value});$(t==='h'?'hg':'ag').value=Number($(t==='h'?'hg':'ag').value)+1;$('minute').value='';$('scorer').value='';renderGoals();report()};$('print').onclick=()=>{report();window.print()};$('refresh').onclick=render;$('clearAll').onclick=()=>{if(confirm('¿Borrar todos los datos de este partido?')){localStorage.removeItem('matchAnalyzerState');location.reload()}};['home','away','homeColor','awayColor','hg','ag','notes'].forEach(id=>$(id).addEventListener('input',()=>{teamOptions();renderStats();renderZones();renderGoals();report()}));$('zoneTeam').addEventListener('change',renderZones);load();render();})();
</script><script>if('serviceWorker' in navigator && location.protocol!=='file:'){navigator.serviceWorker.register('./sw.js').catch(()=>{});}</script></body></html>
